<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Handle client-side routing for SPAs on GitHub Pages
      (function() {
        var path = window.location.pathname;
        var baseUrl = '/personal-website/';
        
        // If we're already at the base URL, don't redirect
        if (path === baseUrl || path === baseUrl + 'index.html') {
          return;
        }
        
        // Redirect to the base URL with hash-based routing
        var redirectUrl = baseUrl + '#' + path.substring(baseUrl.length);
        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
